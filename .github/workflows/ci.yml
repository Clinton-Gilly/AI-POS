name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Includes the two structural rules: no raw ctx.db outside the repository
      # layer, and no process.env outside src/config/env.ts.
      - name: Lint
        run: npm run lint

      # The cross-tenant isolation matrix lives here. It is release-blocking:
      # everything built in later phases sits on top of these guarantees.
      - name: Test
        run: npm test

      - name: Format check
        run: npm run format:check

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Placeholder values: the build only needs these to satisfy boot-time
      # validation. No real credential belongs in CI for a build check, and
      # nothing here reaches a deployed environment.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
          CLERK_SECRET_KEY: sk_test_placeholder
